# Production stack: Postgres, the release, and Caddy terminating TLS.
#
#   cp .env.example .env     then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
name: chat_server_prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: chat_server
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_server"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "/app/bin/migrate && exec /app/bin/server"]
    environment:
      DATABASE_URL: ecto://postgres:${POSTGRES_PASSWORD}@db/chat_server
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      PHX_HOST: ${PHX_HOST:?set PHX_HOST in .env}
      POOL_SIZE: ${POOL_SIZE:-20}
      PORT: 4000
      # Caddy is the only way in, so its x-forwarded-for can be trusted.
      TRUST_PROXY: "true"
      MESSAGE_RETENTION: ${MESSAGE_RETENTION:-keep_metadata}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
    expose:
      - "4000"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PHX_HOST: ${PHX_HOST}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pg_data:
  caddy_data:
  caddy_config:
