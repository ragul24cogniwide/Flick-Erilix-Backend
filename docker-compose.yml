# Development stack.
#
#   docker compose up            Postgres + the API on http://localhost:4000
#   docker compose up db         Postgres only (run `mix phx.server` on the host)
#   bin/mix test                 run any mix task inside the toolchain container
name: chat_server

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    image: elixir:1.18-otp-27
    working_dir: /app
    environment:
      DB_HOST: db
      MIX_ENV: ${MIX_ENV:-dev}
      PORT: 4000
      # Returns sign-in codes in the API response, so the app can show them on screen.
      DEV_MODE_EXPOSE_OTP: ${DEV_MODE_EXPOSE_OTP:-true}
    command: >
      sh -c "mix local.hex --force --if-missing &&
             mix local.rebar --force --if-missing &&
             mix deps.get && mix ecto.setup && mix phx.server"
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - .:/app
      # Build output stays in named volumes so Linux artifacts never land on the host.
      - deps:/app/deps
      - build:/app/_build
      - mix_home:/root/.mix
      - hex_home:/root/.hex
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  deps:
  build:
  mix_home:
  hex_home:
